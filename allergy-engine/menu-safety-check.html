<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Plate - 메뉴 안전/위험 판정</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f0e7; min-height: 100vh; padding: 16px; }
.container { max-width: 500px; margin: 0 auto; }

/* 헤더 */
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.header-icon { width: 36px; height: 36px; border-radius: 12px; background: #0d6a4e; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 14px; }
.header-text h1 { font-size: 18px; color: #14231d; }
.header-text p { font-size: 10px; color: #0d6a4e; font-weight: 700; letter-spacing: .05em; }
.gemini-badge { margin-left: auto; padding: 5px 10px; border-radius: 999px; background: linear-gradient(135deg, #2563eb, #0d6a4e); color: #fff; font-size: 9px; font-weight: 800; }

/* 카드 */
.card { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
.card-title { font-size: 11px; font-weight: 800; color: #0d6a4e; letter-spacing: .04em; margin-bottom: 10px; }

/* 알레르기 선택 */
.allergy-input { width: 100%; padding: 10px 12px; border: 1px solid #dfe7e2; border-radius: 10px; font-size: 13px; outline: none; margin-bottom: 8px; }
.allergy-input:focus { border-color: #0d6a4e; }
.allergy-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.allergy-tag { padding: 5px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; background: #fff0ed; border: 1px solid #e6aaa3; color: #8e2b27; cursor: pointer; }
.allergy-tag:hover { background: #ffe0da; }
.quick-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.quick-tag { padding: 4px 8px; border-radius: 999px; font-size: 9px; border: 1px solid #dfe7e2; background: #f8faf9; cursor: pointer; }
.quick-tag:hover { border-color: #0d6a4e; }
.quick-tag.active { background: #fff0ed; border-color: #e6aaa3; color: #8e2b27; }

/* 업로드 */
.upload-box { border: 2px dashed #cbd9d2; border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; transition: all .2s; }
.upload-box:hover { border-color: #0d6a4e; background: #f5fcf8; }
.upload-box.active { border-style: solid; border-color: #0d6a4e; background: #f0faf5; }
.upload-emoji { font-size: 28px; }
.upload-label { font-size: 12px; color: #68766f; margin-top: 6px; }
.upload-label strong { color: #14231d; display: block; }
.preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }

/* 맵기 설정 */
.spicy-row { display: flex; align-items: center; gap: 8px; }
.spicy-label { flex: 1; font-size: 12px; font-weight: 700; }
.spicy-select { padding: 6px 10px; border: 1px solid #dfe7e2; border-radius: 8px; font-size: 12px; }

/* 분석 버튼 */
.analyze-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; background: #0d6a4e; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px; box-shadow: 0 6px 18px rgba(13,106,78,.2); }
.analyze-btn:disabled { background: #9bc8b5; cursor: not-allowed; }

/* 로딩 */
.loading { display: none; text-align: center; padding: 30px; }
.loading.show { display: block; }
.spinner { width: 28px; height: 28px; border: 3px solid #e3ece7; border-top-color: #0d6a4e; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 결과 헤더 */
.result-header { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: #0d6a4e; color: #fff; margin-bottom: 12px; }
.result-check { width: 28px; height: 28px; border-radius: 9px; background: #fff; color: #0d6a4e; display: grid; place-items: center; font-weight: 900; font-size: 14px; }
.result-header-info h2 { font-size: 15px; margin-bottom: 2px; }
.result-header-info p { font-size: 10px; opacity: .8; }

/* 경고 카드 */
.warning-card { display: flex; gap: 10px; padding: 12px; border-radius: 12px; background: #fff6df; margin-bottom: 10px; }
.warning-card.danger { background: #fff0ed; }
.warning-emoji { font-size: 20px; }
.warning-text { font-size: 11px; color: #5c4813; }
.warning-card.danger .warning-text { color: #8e2b27; }
.warning-text strong { display: block; margin-bottom: 2px; }

/* 메뉴 리스트 */
.menu-section-title { font-size: 11px; font-weight: 800; color: #0d6a4e; letter-spacing: .04em; margin: 16px 0 8px; }
.menu-card { background: #fff; border: 1px solid #edf1ef; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.menu-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.safety-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.safety-dot.safe { background: #22c55e; box-shadow: 0 0 0 3px #dcfce7; }
.safety-dot.danger { background: #ef4444; box-shadow: 0 0 0 3px #fee2e2; }
.safety-dot.caution { background: #f59e0b; box-shadow: 0 0 0 3px #fef3c7; }
.menu-name-area { flex: 1; }
.menu-source { font-size: 10px; color: #68766f; }
.menu-name { font-size: 15px; font-weight: 800; color: #14231d; margin: 2px 0; }
.menu-desc { font-size: 11px; color: #68766f; line-height: 1.4; }
.menu-price { font-size: 14px; font-weight: 800; color: #14231d; white-space: nowrap; }

/* 메뉴 상세 정보 */
.menu-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.detail-box { padding: 8px 10px; border-radius: 8px; background: #f8faf9; }
.detail-box.warning { background: #fff0ed; }
.detail-label { font-size: 8px; font-weight: 700; color: #68766f; margin-bottom: 3px; }
.detail-value { font-size: 11px; font-weight: 600; color: #14231d; }
.detail-box.warning .detail-value { color: #dc2626; }

/* 신뢰도 바 */
.confidence-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.confidence-label { font-size: 9px; color: #68766f; white-space: nowrap; }
.confidence-bar { flex: 1; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
.confidence-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #f59e0b, #22c55e); }

/* 면책 */
.disclaimer { font-size: 9px; color: #92400e; background: #fffbeb; padding: 8px 10px; border-radius: 8px; margin-top: 8px; line-height: 1.4; }

/* 숨김 */
.hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <!-- 헤더 -->
  <div class="header">
    <div class="header-icon">M</div>
    <div class="header-text">
      <p>AI DINING COPILOT</p>
      <h1>MenuMate</h1>
    </div>
    <span class="gemini-badge">GEMINI AI</span>
  </div>

  <!-- 알레르기 선택 -->
  <div class="card">
    <div class="card-title">⚠️ 나의 알레르기 / 식이제한</div>
    <input type="text" class="allergy-input" id="allergyInput" placeholder="알레르기 입력 후 Enter (예: 땅콩, 우유...)">
    <div class="allergy-tags" id="allergyTags"></div>
    <div class="quick-tags" id="quickTags"></div>
  </div>

  <!-- 맵기 설정 -->
  <div class="card">
    <div class="card-title">🌶️ 맵기 설정</div>
    <div class="spicy-row">
      <span class="spicy-label">매운 음식 허용 수준</span>
      <select class="spicy-select" id="spicyLevel">
        <option value="none">못 먹음 (아예 제외)</option>
        <option value="mild">약간만 OK</option>
        <option value="medium" selected>보통까지 OK</option>
        <option value="any">상관없음</option>
      </select>
    </div>
  </div>

  <!-- 메뉴판 업로드 -->
  <div class="card">
    <div class="card-title">📷 메뉴판 사진</div>
    <div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
      <div class="upload-emoji">📸</div>
      <div class="upload-label"><strong>메뉴판을 촬영하거나 업로드</strong>사진이 없으면 샘플 메뉴로 테스트합니다</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
    <img class="preview" id="preview">
  </div>

  <!-- 분석 버튼 -->
  <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">🔍 메뉴 안전 분석 시작</button>

  <!-- 로딩 -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="font-size:12px;color:#68766f;">Gemini AI가 메뉴를 분석하고 있어요...</p>
  </div>

  <!-- 결과 영역 -->
  <div id="resultArea" class="hidden"></div>
</div>

<script>
// API 키
const GEMINI_API_KEY = "AQ.Ab8RN6LaQt30dEq6cY-PO9Rhx1NblrBNzjK2wLUI7CA6OGm0wA";

// 상태
let allergies = [];
let imageBase64 = null;

// 빠른 태그
const QUICK_OPTIONS = [
  { id: "peanut", emoji: "🥜", name: "땅콩" },
  { id: "milk", emoji: "🥛", name: "우유" },
  { id: "egg", emoji: "🥚", name: "달걀" },
  { id: "wheat", emoji: "🌾", name: "밀/글루텐" },
  { id: "shellfish", emoji: "🦐", name: "갑각류" },
  { id: "soy", emoji: "🫘", name: "대두" },
  { id: "fish", emoji: "🐟", name: "생선" },
  { id: "treenut", emoji: "🌰", name: "견과류" },
  { id: "sesame", emoji: "🔸", name: "참깨" },
  { id: "buckwheat", emoji: "🌾", name: "메밀" },
];

// 초기화
window.onload = function() {
  renderQuickTags();
  document.getElementById('allergyInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && this.value.trim()) {
      addAllergy(this.value.trim());
      this.value = '';
    }
  });
};

function renderQuickTags() {
  const html = QUICK_OPTIONS.map(opt => {
    const active = allergies.includes(opt.name) ? 'active' : '';
    return `<span class="quick-tag ${active}" onclick="toggleQuick('${opt.name}')">${opt.emoji} ${opt.name}</span>`;
  }).join('');
  document.getElementById('quickTags').innerHTML = html;
}

function toggleQuick(name) {
  if (allergies.includes(name)) {
    allergies = allergies.filter(a => a !== name);
  } else {
    allergies.push(name);
  }
  renderTags();
  renderQuickTags();
}

function addAllergy(name) {
  if (!allergies.includes(name)) {
    allergies.push(name);
    renderTags();
    renderQuickTags();
  }
}

function removeAllergy(name) {
  allergies = allergies.filter(a => a !== name);
  renderTags();
  renderQuickTags();
}

function renderTags() {
  const html = allergies.map(a =>
    `<span class="allergy-tag" onclick="removeAllergy('${a}')">${a} ×</span>`
  ).join('');
  document.getElementById('allergyTags').innerHTML = html;
}

// 파일 업로드
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('preview').src = ev.target.result;
    document.getElementById('preview').style.display = 'block';
    document.getElementById('uploadBox').classList.add('active');
    imageBase64 = ev.target.result.split(',')[1];
  };
  reader.readAsDataURL(file);
}

// 분석
async function analyze() {
  const spicyLevel = document.getElementById('spicyLevel').value;
  const spicyText = { none: "매운 음식을 전혀 못 먹음", mild: "약간 매운 것만 가능", medium: "보통 매운맛까지 가능", any: "매운 것 상관없음" }[spicyLevel];

  document.getElementById('loading').classList.add('show');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('analyzeBtn').disabled = true;

  const prompt = `당신은 레스토랑 메뉴판을 분석하여 알레르기와 맵기 안전성을 판정하는 AI입니다.

사용자 정보:
- 알레르기/식이제한: ${allergies.length > 0 ? allergies.join(", ") : "없음"}
- 맵기 허용: ${spicyText}

${imageBase64 ? "첨부된 메뉴판 이미지를 분석해주세요." : `다음 샘플 메뉴를 분석해주세요:
- えのきうどん (팽이버섯 우동) ¥430 - 우동 면, 우동 육수, 팽이버섯
- きつねうどん (유부 우동) ¥430 - 우동 면, 우동 육수, 유부
- わかめうどん (미역 우동) ¥430 - 우동 면, 우동 육수, 미역
- カレーうどん (카레 우동) ¥530 - 우동 면, 카레 소스, 돼지고기 (매운맛 있음)
- 担々麺 (탄탄멘) ¥680 - 면, 땅콩 소스, 고추기름 (매우 매움)
- 天ぷらうどん (튀김 우동) ¥580 - 우동 면, 새우 튀김, 밀가루
- ざるそば (자루소바) ¥450 - 메밀면, 간장, 대파
- 親子丼 (오야코동) ¥550 - 쌀밥, 닭고기, 달걀, 간장`}

각 메뉴에 대해 분석하고 반드시 아래 JSON으로만 응답하세요:
{
  "menuItems": [
    {
      "sourceName": "원래 메뉴명 (현지어)",
      "translatedName": "한국어 번역",
      "price": "가격 문자열 (예: JP¥430)",
      "description": "메뉴 간단 설명 (한국어, 1줄)",
      "ingredients": ["주요 재료1", "재료2"],
      "allergens": ["해당 알레르기 물질"],
      "spicyLevel": "none|mild|medium|hot|extreme",
      "safety": "safe|caution|danger",
      "safetyReason": "판정 이유 (예: 땅콩 소스 포함)",
      "confidence": 95,
      "category": "분류 (예: noodle, rice, side)"
    }
  ],
  "summary": {
    "total": 0,
    "safe": 0,
    "caution": 0,
    "danger": 0
  }
}

safety 판정 기준:
- "safe" (초록): 사용자의 알레르기 물질이 없고, 맵기도 허용 범위 내
- "caution" (노랑): 교차오염 가능성 있거나, 성분 확인 필요
- "danger" (빨강): 사용자의 알레르기 물질 포함 또는 맵기 허용 초과`;

  const parts = [];
  if (imageBase64) {
    parts.push({ inlineData: { mimeType: "image/jpeg", data: imageBase64 } });
  }
  parts.push({ text: prompt });

  try {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 8192, responseMimeType: "application/json" }
        })
      }
    );

    if (!res.ok) throw new Error(`API 오류: ${res.status}`);
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!text) throw new Error("응답 없음");

    const cleaned = text.replace(/```json\n?/g, "").replace(/```\n?/g, "").trim();
    const result = JSON.parse(cleaned);
    renderResult(result);
  } catch (err) {
    document.getElementById('resultArea').innerHTML = `<div class="card" style="background:#fff0ed;color:#8e2b27;font-size:12px;">오류: ${err.message}</div>`;
    document.getElementById('resultArea').classList.remove('hidden');
  } finally {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('analyzeBtn').disabled = false;
  }
}

// 결과 렌더링
function renderResult(result) {
  const { menuItems, summary } = result;

  let html = '';

  // 결과 헤더
  html += `<div class="result-header">
    <div class="result-check">✓</div>
    <div class="result-header-info">
      <h2>${summary.total}개 메뉴를 찾았어요</h2>
      <p>안전 ${summary.safe}개 · 주의 ${summary.caution}개 · 위험 ${summary.danger}개</p>
    </div>
  </div>`;

  // 경고
  if (allergies.length > 0 && summary.danger > 0) {
    html += `<div class="warning-card danger">
      <span class="warning-emoji">🚫</span>
      <div class="warning-text"><strong>${allergies.join(", ")} 관련 위험 메뉴 ${summary.danger}개 발견</strong>빨간 동그라미 메뉴는 주문하지 마세요.</div>
    </div>`;
  }

  html += `<div class="disclaimer">⚠️ 재료와 알레르기 정보는 AI 추정 정보이므로 정확한 알레르기 유발 물질 및 성분은 매장 직원을 통해 반드시 확인하시기 바랍니다.</div>`;

  // 메뉴 섹션
  html += `<div class="menu-section-title">RECOGNIZED MENU</div>`;
  html += `<div style="font-size:16px;font-weight:800;margin-bottom:12px;">인식한 메뉴</div>`;

  // 메뉴 카드들
  menuItems.forEach(item => {
    const spicyText = { none: "맵지 않음", mild: "약간 매움", medium: "보통 매움", hot: "매움", extreme: "매우 매움" }[item.spicyLevel] || "맵지 않음";
    const allergenDisplay = item.allergens.length > 0 ? item.allergens.join(", ") : "없음";
    const isWarningAllergen = item.allergens.length > 0 && item.safety !== "safe";

    html += `<div class="menu-card">
      <div class="menu-top">
        <div class="safety-dot ${item.safety}"></div>
        <div class="menu-name-area">
          <div class="menu-source">${item.sourceName}</div>
          <div class="menu-name">${item.translatedName}</div>
          <div class="menu-desc">${item.description}</div>
        </div>
        <div class="menu-price">${item.price}</div>
      </div>
      <div class="menu-details">
        <div class="detail-box">
          <div class="detail-label">대표 재료</div>
          <div class="detail-value">${item.ingredients.join(", ")}</div>
        </div>
        <div class="detail-box ${isWarningAllergen ? 'warning' : ''}">
          <div class="detail-label">알레르기</div>
          <div class="detail-value">${allergenDisplay}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">매운맛</div>
          <div class="detail-value">${spicyText}</div>
        </div>
        <div class="detail-box">
          <div class="detail-label">분류</div>
          <div class="detail-value">${item.category}</div>
        </div>
      </div>
      <div class="confidence-row">
        <span class="confidence-label">인식 신뢰도 ${item.confidence}%</span>
        <div class="confidence-bar"><div class="confidence-fill" style="width:${item.confidence}%"></div></div>
      </div>
    </div>`;
  });

  document.getElementById('resultArea').innerHTML = html;
  document.getElementById('resultArea').classList.remove('hidden');
}
</script>
</body>
</html>
